# Deploy do Bragantino — MESMO código-fonte de wrangler.toml (main =
# src/index.ts, nunca duplicado), config/env própria. Ver auditoria
# Matches/football multiclube (docs/multiclub) pra contexto completo.
#
# Worker já deployado (2026-09-08) em bragantino-app.lucasdiogo1234.workers.dev
# — News, YouTube, X e Instagram confirmados reais e isolados por clube.
#
# `name` diferente de "goias-app" de propósito — cada deploy tem seu
# próprio subdomínio `*.workers.dev`; nomes/domínio final ainda podem
# mudar numa etapa de infra dedicada, isto é só o necessário pra existir.
name = "bragantino-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[assets]
# Saída de `node tool/build_web_flavor.mjs bragantino` (ver
# tool/build_web_flavor.mjs) — NUNCA build/web (isso é do Goiás).
directory = "build/flavors/web/bragantino"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]

# Código do clube que ESTE deploy serve — allowlist de
# `resolveClubServerConfig`. `/api/football/team/goias` NESTE deploy
# sempre lança UnknownClubError, por design.
CLUB_CODE = "bragantino"

# Confirmado navegando onefootball.com/pt-br/time/rb-bragantino-4734 (e
# /en/team/rb-bragantino-4734) — nome oficial exibido "RB Bragantino", id
# numérico 4734 (usado só no slug, não há campo de id numérico nesta
# config — ver ClubServerConfig).
TEAM_ONEFOOTBALL_SLUG = "rb-bragantino-4734"

# Confirmado navegando onefootball.com/pt-br/competicao/
# brasileirao-betano-16 (e /tabela) — RB Bragantino aparece na
# classificação. Nome de exibição na própria página é "Brasileirão
# Betano" (patrocínio); PRIMARY_COMPETITION_DISPLAY_NAME abaixo usa
# "Brasileirão Série A" pelo mesmo motivo do Goiás usar "Brasileirão
# Série B" em vez do nome com patrocinador.
PRIMARY_COMPETITION_SLUG = "brasileirao-betano-16"
PRIMARY_COMPETITION_DISPLAY_NAME = "Brasileirão Série A"

CACHE_VERSION = "1"

# Instagram — pipeline igual ao do Goiás (Apify -> Cron -> KV ->
# InstagramProvider), isolado por clube.
#
# Conta oficial confirmada em 2026-09-08 (username `redbullbragantino`):
# batida entre a config própria do site oficial (bloco
# `social-follow-panel` embutido em redbullbragantino.com, o mesmo
# `buttonsOverride` que também lista `x.com/RedBullBraga` — handle já
# confirmado e em produção) e o próprio perfil do Instagram, verificado,
# com bio "Perfil oficial do Red Bull Bragantino" e posts recentes
# (setembro de 2026). Nunca confundir com Red Bull Brasil, fan pages ou
# perfis regionais.
#
# APIFY_INSTAGRAM_TASK_ID — Task DEDICADA do Bragantino (não é a do Goiás,
# que está com o username fixado no próprio painel do Apify — ver
# docs/multiclub/04_external_integrations.md, nunca reaproveitável só
# trocando parâmetro daqui). Task "rb-bragantino-instagram-latest",
# Actor "instagram-post-scraper", input apontando pro `redbullbragantino`
# confirmado acima. Configurada em 2026-09-08. Task ID não é secret.
APIFY_INSTAGRAM_TASK_ID = "nfbZY0CVxSVlsqawS"

# APIFY_TOKEN (secret) configurado em 2026-09-08 via
# `wrangler secret put APIFY_TOKEN --config wrangler.bragantino.toml`
# neste deploy especificamente — secrets não são compartilhados entre
# deploys, mesmo usando o mesmo token do Goiás. INSTAGRAM_SYNC_KEY (secret
# da rota admin de sync manual) também configurado, mesmo padrão do Goiás.
#
# Instagram atualizado 2x/dia pelo Cron:
# 14h UTC = 11h BRT
# 20h UTC = 17h BRT
#
# REDUZIDO de 4x/dia -> 2x/dia em 2026-09-08 (decisão do usuário): a conta
# Cloudflare tem limite de 5 cron triggers no total (plano Free) — Goiás
# usa 3 (ver wrangler.toml), sobram exatamente 2 pro Bragantino. Horários
# desencontrados de propósito dos horários do Goiás (08h/14h/20h BRT) pra
# nunca disparar os dois ao mesmo tempo / concorrer pela mesma cota da
# conta Apify.
[triggers]
crons = ["0 14 * * *", "0 20 * * *"]

# MESMO namespace físico do Goiás, de propósito — não é vazamento: a
# isolação é pela CHAVE (`instagram:<code>:latest`, ver `instagramKvKey`
# em `club_media_config.ts`), nunca pelo namespace. É exatamente pra isso
# que a chave carrega o código do clube.
[[kv_namespaces]]
binding = "SOCIAL_FEED_KV"
id = "ef4444f9b6eb46df882659dcb9b41703"
