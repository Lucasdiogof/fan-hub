name: goias_app
description: "Goiás EC - o ecossistema digital do torcedor esmeraldino."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^8.0.3
  go_router: ^15.1.2
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  supabase_flutter: ^2.17.2
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  flame: ^1.38.0
  share_plus: ^13.3.0
  video_player: ^2.14.0
  pdf: ^3.11.3
  printing: ^5.14.2
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/assets/
    - lib/assets/legal/
    - lib/assets/content/
    - lib/assets/sponsors/
    - lib/assets/branding/
    - lib/assets/games/guess_player/
    - lib/assets/games/penalty/
    - lib/assets/squad/
    - lib/assets/store/products/uniform_01_female_fan/
    - lib/assets/store/products/uniform_03_male/
    - lib/assets/store/products/uniform_02_youth/
    - lib/assets/store/promo/
    - lib/assets/videos/
    - lib/assets/audio/club/hinos/
    - lib/assets/audio/club/musicas/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets_gen/app_icon.png"
  adaptive_icon_background: "#004C1B"
  adaptive_icon_foreground: "assets_gen/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets_gen/app_icon.png"
    background_color: "#004C1B"
    theme_color: "#004C1B"

flutter_native_splash:
  color: "#F6F8F7"
  android_12:
    color: "#F6F8F7"
  web: false
