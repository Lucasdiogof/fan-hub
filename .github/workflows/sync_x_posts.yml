name: Sync X posts

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo para TODOS os clubes de propósito: o job inteiro roda
# sequencial e sozinho (nunca duas execuções deste workflow em paralelo),
# então nunca há duas corridas tentando dar `git push` ao mesmo tempo. Os
# dois clubes são sincronizados DENTRO do mesmo job (não um workflow por
# clube), pelo mesmo motivo — evita qualquer race entre eles sem precisar
# de lock extra.
concurrency:
  group: sync-x-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scweet
        run: pip install "Scweet>=5.3,<6"

      - name: Git identity
        run: |
          git config user.name "Lucas Diogo"
          git config user.email "lucasdiogo1234@gmail.com"

      # --- Goiás ---------------------------------------------------------
      # `git pull --rebase` SÓ pode rodar com a árvore limpa — depois do
      # script já ter escrito o JSON, a árvore está suja e o rebase falha
      # com "cannot pull with rebase: You have unstaged changes." (visto ao
      # vivo numa execução real). Por isso o rebase vem ANTES do fetch
      # (árvore garantidamente limpa aqui — logo após o checkout) e de novo
      # DEPOIS do commit (a mudança já virou commit local, então a árvore
      # está limpa outra vez e o rebase é válido).
      - name: Rebase before Goiás sync
        run: git pull --rebase origin main

      - name: Fetch latest posts (Goiás)
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          # Cookie ct0 da mesma sessão do X. Sem ele a Scweet tenta derivar
          # um chamando o X, e é essa chamada que falha no runner
          # (AccountPoolExhausted: missing_csrf).
          X_CSRF_TOKEN: ${{ secrets.X_CSRF_TOKEN }}
          # Vazio por padrão. Se o X estiver bloqueando o IP do runner (a
          # teoria principal hoje), definir este secret tira a requisição do
          # datacenter do GitHub sem precisar mexer no script.
          X_PROXY: ${{ secrets.X_PROXY }}
        run: python scripts/social/sync_x_posts.py --club goias

      - name: Commit and push if changed (Goiás)
        run: |
          if git diff --quiet -- src/social/data/goias/x_posts.json; then
            echo "No changes to commit (Goiás)"
            exit 0
          fi
          git add src/social/data/goias/x_posts.json
          git commit -m "Update X posts feed"
          git pull --rebase origin main
          git push

      # --- Bragantino ------------------------------------------------------
      # MESMOS secrets de sessão do X (X_AUTH_TOKEN/X_CSRF_TOKEN/X_PROXY) —
      # eles autenticam a CONTA QUE RASPA, não o clube; a mesma sessão lê a
      # timeline pública de qualquer handle. Só o handle/output mudam.
      #
      # Rebase de novo aqui, mesmo motivo do Goiás acima: garante árvore
      # limpa antes deste fetch, e também cobre o caso de algo ter avançado
      # origin/main enquanto o step do Goiás rodava (concurrency.group só
      # serra execuções DESTE workflow — um push manual de outra sessão,
      # como já aconteceu nesta mesma frente, ainda pode acontecer no meio).
      - name: Rebase before Bragantino sync
        run: git pull --rebase origin main

      - name: Fetch latest posts (Bragantino)
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CSRF_TOKEN: ${{ secrets.X_CSRF_TOKEN }}
          X_PROXY: ${{ secrets.X_PROXY }}
        run: python scripts/social/sync_x_posts.py --club bragantino

      - name: Commit and push if changed (Bragantino)
        run: |
          if git diff --quiet -- src/social/data/bragantino/x_posts.json; then
            echo "No changes to commit (Bragantino)"
            exit 0
          fi
          git add src/social/data/bragantino/x_posts.json
          git commit -m "Update X posts feed (Bragantino)"
          git pull --rebase origin main
          git push
