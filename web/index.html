<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Goiás EC - o ecossistema digital do torcedor esmeraldino.">

  <!--
    SEM `viewport-fit=cover` de propósito: no iOS 26 em PWA standalone, junto com
    `black-translucent`, o `visualViewport.offsetTop` nasce em 59px (altura da
    status bar) e TODO toque chega no Flutter 59px abaixo de onde o dedo tocou —
    a tela parece travada até o teclado abrir/fechar e zerar o offset. Medido
    com log de diagnóstico em 2026-10-02; o app já é desenhado abaixo da status
    bar (`padTop` 0), então nada visível se perde.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS PWA standalone: sem `apple-mobile-web-app-capable`, o iOS ignora
    completamente o `status-bar-style` abaixo e abre como um web clip comum.
    `black` (barra sólida preta, sem sobreposição) e NÃO `black-translucent`:
    o translucent causa o deslocamento de 59px nos toques descrito acima. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Goiás EC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Cor da UI do navegador (aba do Safari/Chrome, barra de tarefas do
    Android) — não é o mecanismo que controla a status bar da PWA instalada
    no iOS (isso é só o `apple-mobile-web-app-status-bar-style` acima), mas
    ajuda a barra do Safari normal (fora do modo standalone) e o Chrome/PWA
    no Android a já abrirem na cor certa antes do Flutter pintar. Segue
    `prefers-color-scheme` do SISTEMA — não tem como refletir o tema
    escolhido manualmente dentro do app aqui fora do Flutter. -->
  <meta name="theme-color" content="#F6F8F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09110C" media="(prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Goiás EC</title>
  <link rel="manifest" href="manifest.json">

  <!--
    PWA em modo standalone no iOS Safari não tem barra de endereço pra
    "absorver" o esticão elástico de rolagem além do conteúdo — sem isso,
    arrastar a tela além do topo/fim revela um retângulo cinza (o fundo
    nativo por trás do canvas do Flutter) em vez de simplesmente não
    rolar mais. `overscroll-behavior: none` trava esse comportamento;
    `position: fixed` + `height: 100%` no html/body garante que não
    exista nenhum espaço "extra" pra arrastar em primeiro lugar.

    O background aqui só é visível no instante entre o iOS abrir a PWA e o
    Flutter terminar de inicializar e pintar sua própria tela (splash) —
    depois disso é sempre o canvas do Flutter (que já cobre a tela inteira,
    inclusive atrás da status bar, e reage ao tema ESCOLHIDO NO APP, não ao
    do sistema) quem manda no que aparece. Por isso aqui só dá pra seguir o
    tema do SISTEMA (`prefers-color-scheme`) como melhor palpite pra esse
    instante inicial — sem acesso ao estado do Flutter antes dele carregar.
  -->
  <style>
    html, body {
      position: fixed;
      overflow: hidden;
      overscroll-behavior: none;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #F6F8F7;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background: #09110C;
      }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      config: { useLocalCanvasKit: true },
    });
  </script>
</body>
</html>
