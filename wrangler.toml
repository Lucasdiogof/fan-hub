name = "goias-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Fonte esportiva única: OneFootball (endpoint interno da própria página,
# api.onefootball.com/web-experience/... — sem key, sem secret). Cobre
# próximo jogo, rodada atual (com todos os times), detalhe de partida e
# classificação (essa última só com saldo de gols, não gols pró/contra
# separados — é tudo que o OneFootball expõe, e é tudo que a UI mostra).
# campeonato-brasileiro-api e TheSportsDB foram removidos — cobriam a mesma
# coisa com mais fricção (scraping do ge.globo, key pública compartilhada
# do TheSportsDB com rate limit de ~30 req/min).
#
# CACHE_VERSION entra na chave de cache de cada endpoint — bump manual
# sempre que uma mudança de formato/normalização puder tornar o JSON
# cacheado antigo incompatível com o que o Flutter espera agora. Sem isso,
# uma correção de bug no Worker só valeria depois do TTL do cache antigo
# expirar (até 45min), mesmo já deployada.
[vars]

# Slug do Goiás no OneFootball (path /pt-br/time/<slug>) — usado pro card de
# Próximo Jogo e pela tela de Jogos. Confirmado navegando o site, não muda
# entre temporadas (é o id do clube, não do campeonato).
GOIAS_ONEFOOTBALL_SLUG = "goias-1863"

# Slug da competição no OneFootball (path /pt-br/competicao/<slug>) — ESSE
# muda a cada temporada/edição. Se a rodada atual ou a classificação
# pararem de bater, confira se o slug ainda é válido navegando
# https://onefootball.com/pt-br/competicao/.
ONEFOOTBALL_COMPETITION_SLUG = "brasileirao-serie-b-superbet-119"

CACHE_VERSION = "15"

# Task do Apify (Instagram Post Scraper).
# O ID da Task não é secret.
# O APIFY_TOKEN fica como secret do Worker.
APIFY_INSTAGRAM_TASK_ID = "81AnzgCcTifiDW6VH"

# Instagram atualizado 3x/dia pelo Cron:
# 00h / 08h / 16h UTC.
#
# O Cron executa o Apify e salva os últimos posts no KV.
# O Flutter apenas lê os dados já armazenados.
# Nenhuma abertura do aplicativo dispara o Apify.
[triggers]
crons = ["0 */8 * * *"]

# KV persistente do feed social / Instagram.
[[kv_namespaces]]
binding = "SOCIAL_FEED_KV"
id = "ef4444f9b6eb46df882659dcb9b41703"