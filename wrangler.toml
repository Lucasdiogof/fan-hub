name = "goias-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Configuração não-secreta da integração com a API-Football. SERIE_B_LEAGUE_ID
# e GOIAS_TEAM_ID começam vazios de propósito — não são um "chute" que
# funciona sozinho. Preencha depois de confirmar os IDs reais via
# GET /api/football/discover?search=...
#
# SEASON: o plano Free da API-Football não cobre a temporada atual (2026) —
# só 2022 a 2024. Usando 2024 temporariamente pra validar a integração
# ponta a ponta com dados reais; trocar para 2026 depois do upgrade de plano.
#
# A API key (API_FOOTBALL_KEY) NUNCA vai aqui — é secret, configurado via
# `wrangler secret put API_FOOTBALL_KEY` ou pelo dashboard da Cloudflare
# (Settings do Worker → Variables, marcado como "Encrypt"). Em
# desenvolvimento local, use um arquivo `.dev.vars` (não versionado — veja
# .dev.vars.example).
[vars]
SERIE_B_LEAGUE_ID = ""
GOIAS_TEAM_ID = ""
SEASON = "2024"
