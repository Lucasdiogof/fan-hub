name = "goias-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Fontes esportivas gratuitas: campeonato-brasileiro-api (principal —
# classificação/rodada da Série B) + TheSportsDB (complementar — próximo
# jogo/últimos resultados do Goiás). Nenhuma das duas exige secret — só a
# key pública de teste do TheSportsDB, que não é sensível o bastante pra
# precisar ficar fora do repositório.
#
# GOIAS_BRASILEIRAO_ID / GOIAS_THESPORTSDB_ID começam vazios de propósito —
# preencha depois de confirmar os ids reais via GET /api/football/discover.
#
# Sem SEASON aqui de propósito: a campeonato-brasileiro-api lê a página ao
# vivo do ge.globo.com (sempre a temporada corrente, sem parâmetro de
# temporada pra passar) — a temporada exibida vem do próprio dado
# (`competition.season`), não é algo que a gente controla ou espalha.
[vars]
SERIE_CODE = "b"
GOIAS_BRASILEIRAO_ID = "290"
GOIAS_THESPORTSDB_ID = "134295"
