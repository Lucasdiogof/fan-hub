name = "goias-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Fonte esportiva única: OneFootball (endpoint interno da própria página,
# api.onefootball.com/web-experience/... — sem key, sem secret). Cobre
# próximo jogo, rodada atual (com todos os times), detalhe de partida e
# classificação (essa última só com saldo de gols, não gols pró/contra
# separados — é tudo que o OneFootball expõe, e é tudo que a UI mostra).
# campeonato-brasileiro-api e TheSportsDB foram removidos — cobriam a mesma
# coisa com mais fricção (scraping do ge.globo, key pública compartilhada
# do TheSportsDB com rate limit de ~30 req/min).
#
# CACHE_VERSION entra na chave de cache de cada endpoint — bump manual
# sempre que uma mudança de formato/normalização puder tornar o JSON
# cacheado antigo incompatível com o que o Flutter espera agora. Sem isso,
# uma correção de bug no Worker só valeria depois do TTL do cache antigo
# expirar (até 45min), mesmo já deployada.
[vars]

# Código do clube que ESTE deploy serve — único allowlist de
# `resolveClubServerConfig` (ver src/football/_lib/club_server_config.ts).
# Modelo: 1 Worker deploy por clube, mesmo código-fonte — o Bragantino
# (wrangler.bragantino.toml) tem seu próprio CLUB_CODE, nunca os dois no
# mesmo deploy. `/api/football/team/bragantino` NESTE deploy sempre lança
# UnknownClubError, por design (NO_SERVER_CROSS_CLUB_FALLBACK).
CLUB_CODE = "goias"

# Slug do Goiás no OneFootball (path /pt-br/time/<slug>) — usado pro card de
# Próximo Jogo e pela tela de Jogos. Confirmado navegando o site, não muda
# entre temporadas (é o id do clube, não do campeonato).
TEAM_ONEFOOTBALL_SLUG = "goias-1863"

# Slug da competição PRINCIPAL do clube no OneFootball (path
# /pt-br/competicao/<slug>) — ESSE muda a cada temporada/edição. Se a
# rodada atual ou a classificação pararem de bater, confira se o slug ainda
# é válido navegando https://onefootball.com/pt-br/competicao/.
PRIMARY_COMPETITION_SLUG = "brasileirao-serie-b-superbet-119"

# Nome de exibição da competição principal — devolvido em `competition.name`
# pelos endpoints de futebol (nunca o nome com patrocinador do OneFootball).
PRIMARY_COMPETITION_DISPLAY_NAME = "Brasileirão Série B"

CACHE_VERSION = "16"

# Task do Apify (Instagram Post Scraper).
# O ID da Task não é secret.
# O APIFY_TOKEN fica como secret do Worker.
APIFY_INSTAGRAM_TASK_ID = "81AnzgCcTifiDW6VH"

# Instagram atualizado 4x/dia pelo Cron, sempre em horário de Brasil (BRT,
# UTC-3, sem horário de verão) — nunca de madrugada, abrindo o dia de manhã e
# concentrado no fim de tarde/noite (quando o Goiás mais posta, por causa dos
# jogos):
# 10h UTC = 07h BRT
# 18h UTC = 15h BRT
# 23h UTC = 20h BRT
# 02h30 UTC = 23h30 BRT
#
# O Cron executa o Apify e salva os últimos posts no KV.
# O Flutter apenas lê os dados já armazenados.
# Nenhuma abertura do aplicativo dispara o Apify.
[triggers]
crons = ["0 10 * * *", "0 18 * * *", "0 23 * * *", "30 2 * * *"]

# KV persistente do feed social / Instagram.
[[kv_namespaces]]
binding = "SOCIAL_FEED_KV"
id = "ef4444f9b6eb46df882659dcb9b41703"